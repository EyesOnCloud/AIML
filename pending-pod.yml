apiVersion: v1
kind: Pod
metadata:
  name: health-classifier-pending
  labels:
    app: health-classifier
spec:
  containers:
    - name: health-classifier
      image: eyesoncloud/health-classifier:v1
      ports:
        - containerPort: 5000
      resources:
        requests:
          memory: "100Gi"
          cpu: "100m"
      env:
        - name: MODEL_VERSION
          value: "v1"
        - name: METRICS_SOURCE
          value: "prometheus://monitoring.svc:9090"
