apiVersion: v1
kind: Pod
metadata:
  name: health-classifier-crash
  labels:
    app: health-classifier
spec:
  containers:
    - name: health-classifier
      image: eyesoncloud/health-classifier:v1
      ports:
        - containerPort: 5000
      # METRICS_SOURCE is required by app.py at startup but is not set here
      env:
        - name: MODEL_VERSION
          value: "v1"
