apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-api
  template:
    metadata:
      labels:
        app: chat-api
    spec:
      containers:
      - name: chat-api
        image: eyesoncloud/chat-api:sc
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        # ── ConfigMap #1: environment variables ───────────────
        envFrom:
        - configMapRef:
            name: bankbot-env
        # ── Secret: JWT key + user credentials ───────────────
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: bankbot-secret
              key: JWT_SECRET
        - name: USERS_JSON
          valueFrom:
            secretKeyRef:
              name: bankbot-secret
              key: USERS_JSON
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: bankbot-secret
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bankbot-secret
              key: DB_PASSWORD
        # ── ConfigMap #2: RAG files mounted as volume ─────────
        volumeMounts:
        - name: rag-volume
          mountPath: /app/rag-data
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
      volumes:
      # ConfigMap #2 mounted as files at /app/rag-data/
      - name: rag-volume
        configMap:
          name: bankbot-rag-files
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: chat-api
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30180
