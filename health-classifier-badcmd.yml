apiVersion: v1
kind: Pod
metadata:
  name: health-classifier-badcmd
  labels:
    app: health-classifier
spec:
  containers:
    - name: health-classifier
      image: eyesoncloud/health-classifier:v1
      command: ["gunicorn-typo"]
      args: ["-b", "0.0.0.0:5000", "src.app:app"]
      ports:
        - containerPort: 5000
